name: Build plugin

# Builds on every push to main (README and website changes are skipped).
# Pushing a version tag such as v1.0.1, or publishing a release with a new tag
# on GitHub, also attaches ready-to-install zips to that release.

on:
  push:
    branches: [main]
    tags: ['v*']
    paths-ignore: ['**.md', 'docs/**', 'website/**']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: Windows, os: windows-latest }
          - { name: macOS,   os: macos-latest }
          - { name: Linux,   os: ubuntu-latest }

    env:
      # Mac signing switches itself on once the Apple secrets exist (see the launch guide).
      HAS_MAC_SIGNING: ${{ secrets.MACOS_CERTIFICATE != '' }}

    steps:
      - uses: actions/checkout@v6

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libasound2-dev libx11-dev libxcomposite-dev libxcursor-dev \
            libxext-dev libxinerama-dev libxrandr-dev libxrender-dev libfreetype-dev \
            libfontconfig1-dev libgl1-mesa-dev

      - name: Configure
        shell: bash
        run: |
          args=(-S . -B build -DCMAKE_BUILD_TYPE=Release)
          # A tag like v1.2.3 sets the version the DAW shows
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            ver="${GITHUB_REF_NAME#v}"
            if [[ "$ver" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then args+=("-DSQUEEZE_VERSION=$ver"); fi
          fi
          # Universal binary: Apple Silicon + Intel
          if [[ "$RUNNER_OS" == "macOS" ]]; then args+=("-DCMAKE_OSX_ARCHITECTURES=arm64;x86_64"); fi
          cmake "${args[@]}"

      - name: Build
        run: cmake --build build --config Release --parallel

      - name: Sign and notarize (macOS)
        if: runner.os == 'macOS' && env.HAS_MAC_SIGNING == 'true'
        env:
          MACOS_CERTIFICATE: ${{ secrets.MACOS_CERTIFICATE }}
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: .github/scripts/macos-sign.sh

      - name: Upload plugin
        uses: actions/upload-artifact@v6
        with:
          name: Squeeze-${{ matrix.name }}
          path: |
            build/Squeeze_artefacts/Release/VST3
            build/Squeeze_artefacts/Release/AU
          if-no-files-found: error

      # ---- Release packaging (tag builds only) --------------------------------
      - name: Package (Windows)
        if: startsWith(github.ref, 'refs/tags/v') && runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          Compress-Archive -Path build/Squeeze_artefacts/Release/VST3/Squeeze.vst3, build/THIRD_PARTY_NOTICES.txt `
            -DestinationPath "dist/Squeeze-$env:GITHUB_REF_NAME-Windows-VST3.zip"

      - name: Package (macOS)
        if: startsWith(github.ref, 'refs/tags/v') && runner.os == 'macOS'
        run: |
          mkdir -p dist stage
          cp -R build/Squeeze_artefacts/Release/VST3/Squeeze.vst3 build/Squeeze_artefacts/Release/AU/Squeeze.component build/THIRD_PARTY_NOTICES.txt stage/
          ditto -c -k stage "dist/Squeeze-${GITHUB_REF_NAME}-macOS-VST3-AU.zip"

      - name: Package (Linux)
        if: startsWith(github.ref, 'refs/tags/v') && runner.os == 'Linux'
        run: |
          mkdir -p dist
          (cd build/Squeeze_artefacts/Release/VST3 && zip -r -y "$GITHUB_WORKSPACE/dist/Squeeze-${GITHUB_REF_NAME}-Linux-VST3.zip" Squeeze.vst3)
          zip -j "dist/Squeeze-${GITHUB_REF_NAME}-Linux-VST3.zip" build/THIRD_PARTY_NOTICES.txt

      - name: Upload release package
        if: startsWith(github.ref, 'refs/tags/v')
        uses: actions/upload-artifact@v6
        with:
          name: release-${{ matrix.name }}
          path: dist/*.zip
          if-no-files-found: error

  release:
    name: Publish release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6

      - uses: actions/download-artifact@v7
        with:
          pattern: release-*
          path: dist
          merge-multiple: true

      - name: Create or update the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ls -la dist
          if gh release view "$GITHUB_REF_NAME" -R "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            # Release was created by hand on GitHub: just attach the files
            gh release upload "$GITHUB_REF_NAME" dist/*.zip --clobber -R "$GITHUB_REPOSITORY"
          else
            gh release create "$GITHUB_REF_NAME" dist/*.zip -R "$GITHUB_REPOSITORY" \
              --title "Squeeze $GITHUB_REF_NAME" --notes-file .github/release-notes.md
          fi
