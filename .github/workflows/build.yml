name: Build plugins

# Every push to main: a Linux build of all the plugins, then their test suites and pluginval.
# A version tag (such as v1.1.0, including one made by publishing a release on GitHub), or
# running this workflow by hand (Actions > Build plugins > Run workflow), also builds for
# Windows, macOS and Linux and packages the zips: one per plugin per system, plus the bundles.
#
# The zips are for paying customers, so they never go anywhere public: not on the public
# release, and not as workflow artifacts (anyone signed in to GitHub can download those from a
# public repo). Each build uploads them to a DRAFT release named "Files for <version> (private)",
# which only people with write access to the repo can see. Download them from there (Releases
# page) and upload them to Payhip.

on:
  push:
    branches: [main]
    tags: ['v*']
    paths-ignore: ['**.md', 'docs/**', 'website/**', 'packaging/**']
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Version to build (e.g. v1.1.0): sets the version the DAW shows and names the private draft. Leave empty for a test build."
        required: false
        default: ""

permissions:
  contents: read

env:
  # The release these builds belong to: the pushed tag, or the tag typed into a hand-started run
  RELEASE_TAG: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || inputs.release_tag }}

# A newer push to main replaces a build that's still running for an older one (saves minutes)
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

jobs:
  test:
    name: Linux build and tests
    runs-on: ubuntu-latest
    env:
      CCACHE_DIR: ${{ github.workspace }}/.ccache
      CCACHE_MAXSIZE: 1G
    steps:
      - uses: actions/checkout@v6

      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libasound2-dev libx11-dev libxcomposite-dev libxcursor-dev \
            libxext-dev libxinerama-dev libxrandr-dev libxrender-dev libfreetype-dev \
            libfontconfig1-dev libgl1-mesa-dev xvfb ccache

      - name: Restore compiler cache
        uses: actions/cache@v5
        with:
          path: .ccache
          key: ccache-linux-${{ github.sha }}
          restore-keys: ccache-linux-

      - name: Configure
        run: |
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DLBAUDIO_BUILD_TESTS=ON -DLBAUDIO_LTO=OFF \
            -DCMAKE_C_COMPILER_LAUNCHER=ccache -DCMAKE_CXX_COMPILER_LAUNCHER=ccache

      # A fixed job count: unlimited parallel compiles run the runner out of memory
      - name: Build
        run: cmake --build build --parallel 4

      - name: Run each plugin's test suite
        run: |
          mkdir -p screenshots
          failed=""
          for p in $(cat build/plugins.txt); do
            echo "::group::$p tests"
            xvfb-run -a "build/plugins/$p/${p}Tests_artefacts/Release/${p}Tests" \
              "build/plugins/$p/${p}_artefacts/Release/VST3/$p.vst3" "screenshots/$p.png" || failed="$failed $p"
            echo "::endgroup::"
          done
          if [ -n "$failed" ]; then echo "::error::Tests failed for:$failed"; exit 1; fi

      - name: Validate with pluginval
        run: |
          curl -sSL -o pluginval.zip https://github.com/Tracktion/pluginval/releases/download/v1.0.4/pluginval_Linux.zip
          unzip -q -o pluginval.zip -d pluginval
          failed=""
          for p in $(cat build/plugins.txt); do
            echo "::group::$p pluginval"
            xvfb-run -a pluginval/pluginval --strictness-level 10 --validate-in-process --timeout-ms 600000 \
              "build/plugins/$p/${p}_artefacts/Release/VST3/$p.vst3" || failed="$failed $p"
            echo "::endgroup::"
          done
          if [ -n "$failed" ]; then echo "::error::pluginval failed for:$failed"; exit 1; fi

      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: screenshots
          path: screenshots/*.png
          retention-days: 14
          if-no-files-found: ignore

  draft:
    name: Private draft for the zips
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      id: ${{ steps.draft.outputs.id }}
    steps:
      - name: Find or make the draft
        id: draft
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          label="${RELEASE_TAG:-dev-${GITHUB_SHA::7}}"
          name="Files for $label (private)"
          id=$(gh api "repos/$GITHUB_REPOSITORY/releases?per_page=100" --jq ".[] | select(.draft and .name == \"$name\") | .id" | head -n1)
          if [ -z "$id" ]; then
            id=$(gh api "repos/$GITHUB_REPOSITORY/releases" -f tag_name="$label-files" -f name="$name" -F draft=true \
                   -f body="The zips for $label, for uploading to Payhip. This is a draft: only people with write access to the repo can see it. Don't publish it, or the zips become free downloads." --jq .id)
          fi
          echo "Draft release $id: $name"
          echo "id=$id" >> "$GITHUB_OUTPUT"

  build:
    name: ${{ matrix.name }}
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    needs: [test, draft]
    runs-on: ${{ matrix.os }}
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: Windows, os: windows-latest, jobs: 4 }
          # Intel Mac runners: Apple Silicon runners are often short of capacity. The build is
          # universal (Apple Silicon + Intel) either way.
          - { name: macOS,   os: macos-15-intel, jobs: 4 }
          - { name: Linux,   os: ubuntu-latest,  jobs: 4 }

    env:
      # Mac signing switches itself on once the Apple secrets exist (see the launch guide).
      HAS_MAC_SIGNING: ${{ secrets.MACOS_CERTIFICATE != '' }}

    steps:
      - uses: actions/checkout@v6

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libasound2-dev libx11-dev libxcomposite-dev libxcursor-dev \
            libxext-dev libxinerama-dev libxrandr-dev libxrender-dev libfreetype-dev \
            libfontconfig1-dev libgl1-mesa-dev zip

      - name: Configure
        shell: bash
        run: |
          args=(-S . -B build -DCMAKE_BUILD_TYPE=Release)
          # A tag like v1.2.3 sets the version every plugin shows in the DAW
          if [[ -n "$RELEASE_TAG" ]]; then
            ver="${RELEASE_TAG#v}"
            if [[ "$ver" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then args+=("-DLBAUDIO_VERSION=$ver"); fi
          fi
          # Universal binary: Apple Silicon + Intel
          if [[ "$RUNNER_OS" == "macOS" ]]; then args+=("-DCMAKE_OSX_ARCHITECTURES=arm64;x86_64"); fi
          cmake "${args[@]}"

      - name: Build
        run: cmake --build build --config Release --parallel ${{ matrix.jobs }}

      - name: Sign and notarize (macOS)
        if: runner.os == 'macOS' && env.HAS_MAC_SIGNING == 'true'
        env:
          MACOS_CERTIFICATE: ${{ secrets.MACOS_CERTIFICATE }}
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: .github/scripts/macos-sign.sh

      - name: Package
        shell: bash
        run: |
          if [[ -n "$RELEASE_TAG" ]]; then label="$RELEASE_TAG"; else label="dev-${GITHUB_SHA::7}"; fi
          .github/scripts/package.sh "$label"

      - name: Upload the zips to the private draft
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          DRAFT_ID: ${{ needs.draft.outputs.id }}
        run: .github/scripts/upload-private.sh dist/*.zip

  release:
    name: Release notes
    # A tag pushed without a release made on GitHub gets one, with notes and no files
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6

      - name: Make sure the public release exists (no files on it)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if ! gh release view "$RELEASE_TAG" -R "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            gh release create "$RELEASE_TAG" -R "$GITHUB_REPOSITORY" --title "LBAudio $RELEASE_TAG" --notes-file .github/release-notes.md
          fi
