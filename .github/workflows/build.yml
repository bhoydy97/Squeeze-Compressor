name: Build plugins

# Every push to main: a Linux build of all the plugins, then their test suites and pluginval.
# A version tag (such as v1.1.0, including one made by publishing a release on GitHub), or
# running this workflow by hand (Actions > Build plugins > Run workflow), also builds for
# Windows, macOS and Linux and packages the zips: one per plugin per system, plus the bundle.
# Tag builds attach those zips to the GitHub release.

on:
  push:
    branches: [main]
    tags: ['v*']
    paths-ignore: ['**.md', 'docs/**', 'website/**', 'packaging/**']
  workflow_dispatch:

permissions:
  contents: read

# A newer push to main replaces a build that's still running for an older one (saves minutes)
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

jobs:
  test:
    name: Linux build and tests
    runs-on: ubuntu-latest
    env:
      CCACHE_DIR: ${{ github.workspace }}/.ccache
      CCACHE_MAXSIZE: 1G
    steps:
      - uses: actions/checkout@v6

      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libasound2-dev libx11-dev libxcomposite-dev libxcursor-dev \
            libxext-dev libxinerama-dev libxrandr-dev libxrender-dev libfreetype-dev \
            libfontconfig1-dev libgl1-mesa-dev xvfb ccache

      - name: Restore compiler cache
        uses: actions/cache@v5
        with:
          path: .ccache
          key: ccache-linux-${{ github.sha }}
          restore-keys: ccache-linux-

      - name: Configure
        run: |
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DLBAUDIO_BUILD_TESTS=ON -DLBAUDIO_LTO=OFF \
            -DCMAKE_C_COMPILER_LAUNCHER=ccache -DCMAKE_CXX_COMPILER_LAUNCHER=ccache

      - name: Build
        run: cmake --build build --parallel

      - name: Run each plugin's test suite
        run: |
          mkdir -p screenshots
          failed=""
          for dir in plugins/*/; do
            p="$(basename "$dir")"
            echo "::group::$p tests"
            xvfb-run -a "build/plugins/$p/${p}Tests_artefacts/Release/${p}Tests" \
              "build/plugins/$p/${p}_artefacts/Release/VST3/$p.vst3" "screenshots/$p.png" || failed="$failed $p"
            echo "::endgroup::"
          done
          if [ -n "$failed" ]; then echo "::error::Tests failed for:$failed"; exit 1; fi

      - name: Validate with pluginval
        run: |
          curl -sSL -o pluginval.zip https://github.com/Tracktion/pluginval/releases/download/v1.0.4/pluginval_Linux.zip
          unzip -q -o pluginval.zip -d pluginval
          failed=""
          for dir in plugins/*/; do
            p="$(basename "$dir")"
            echo "::group::$p pluginval"
            xvfb-run -a pluginval/pluginval --strictness-level 10 --validate-in-process --timeout-ms 600000 \
              "build/plugins/$p/${p}_artefacts/Release/VST3/$p.vst3" || failed="$failed $p"
            echo "::endgroup::"
          done
          if [ -n "$failed" ]; then echo "::error::pluginval failed for:$failed"; exit 1; fi

      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: screenshots
          path: screenshots/*.png
          retention-days: 14
          if-no-files-found: ignore

  build:
    name: ${{ matrix.name }}
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    needs: test
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: Windows, os: windows-latest }
          - { name: macOS,   os: macos-latest }
          - { name: Linux,   os: ubuntu-latest }

    env:
      # Mac signing switches itself on once the Apple secrets exist (see the launch guide).
      HAS_MAC_SIGNING: ${{ secrets.MACOS_CERTIFICATE != '' }}

    steps:
      - uses: actions/checkout@v6

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libasound2-dev libx11-dev libxcomposite-dev libxcursor-dev \
            libxext-dev libxinerama-dev libxrandr-dev libxrender-dev libfreetype-dev \
            libfontconfig1-dev libgl1-mesa-dev zip

      - name: Configure
        shell: bash
        run: |
          args=(-S . -B build -DCMAKE_BUILD_TYPE=Release)
          # A tag like v1.2.3 sets the version every plugin shows in the DAW
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            ver="${GITHUB_REF_NAME#v}"
            if [[ "$ver" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then args+=("-DLBAUDIO_VERSION=$ver"); fi
          fi
          # Universal binary: Apple Silicon + Intel
          if [[ "$RUNNER_OS" == "macOS" ]]; then args+=("-DCMAKE_OSX_ARCHITECTURES=arm64;x86_64"); fi
          cmake "${args[@]}"

      - name: Build
        run: cmake --build build --config Release --parallel

      - name: Sign and notarize (macOS)
        if: runner.os == 'macOS' && env.HAS_MAC_SIGNING == 'true'
        env:
          MACOS_CERTIFICATE: ${{ secrets.MACOS_CERTIFICATE }}
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: .github/scripts/macos-sign.sh

      - name: Package
        shell: bash
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then label="$GITHUB_REF_NAME"; else label="dev-${GITHUB_SHA::7}"; fi
          .github/scripts/package.sh "$label"

      - name: Upload zips
        uses: actions/upload-artifact@v6
        with:
          name: LBAudio-${{ matrix.name }}
          path: dist/*.zip
          if-no-files-found: error

  release:
    name: Publish release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6

      - uses: actions/download-artifact@v7
        with:
          pattern: LBAudio-*
          path: dist
          merge-multiple: true

      - name: Create or update the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ls -la dist
          if gh release view "$GITHUB_REF_NAME" -R "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            # Release was created by hand on GitHub: just attach the files
            gh release upload "$GITHUB_REF_NAME" dist/*.zip --clobber -R "$GITHUB_REPOSITORY"
          else
            gh release create "$GITHUB_REF_NAME" dist/*.zip -R "$GITHUB_REPOSITORY" \
              --title "LBAudio $GITHUB_REF_NAME" --notes-file .github/release-notes.md
          fi
